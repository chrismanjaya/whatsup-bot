name: Deploy to GCP VM

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GCP_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.GCP_VM_IP }} >> ~/.ssh/known_hosts

      - name: Copy source to VM
        run: |
          rsync -avz --exclude 'whatsmeow.db' --exclude 'transactions.db' \
            ./ ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_IP }}:~/whatsup-bot/

      - name: Build and restart service
        run: |
          ssh ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_IP }} \
            "cd ~/whatsup-bot && go build -o whatsup-bot . && sudo systemctl restart whatsup-bot"