name: Deploy to GCP VM

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'

      - name: Build binary
        run: go build -o whatsup-bot ./cmd/bot

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GCP_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.GCP_VM_IP }} >> ~/.ssh/known_hosts

      - name: Write environment file
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_IP }} \
            "echo 'GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}' > ~/whatsup-bot.env && chmod 600 ~/whatsup-bot.env"

      - name: Copy binary to VM
        run: |
          scp -i ~/.ssh/id_rsa whatsup-bot ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_IP }}:~/whatsup-bot/whatsup-bot.new

      - name: Replace binary and restart service
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_IP }} \
            "mv ~/whatsup-bot/whatsup-bot.new ~/whatsup-bot/whatsup-bot && chmod +x ~/whatsup-bot/whatsup-bot && sudo systemctl restart whatsup-bot"