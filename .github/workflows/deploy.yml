name: Deploy to GCP VM

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build binaries
        run: |
          go build -trimpath -o whatsup-bot ./cmd/bot
          go build -trimpath -o whatsup-bot-mcp ./cmd/mcp

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GCP_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.GCP_VM_IP }} >> ~/.ssh/known_hosts

      - name: Write environment file
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_IP }} \
            "printf 'GEMINI_API_KEY=%s\nGEMINI_MODEL=%s\nMCP_URL=%s\n' '${{ secrets.GEMINI_API_KEY }}' '${{ secrets.GEMINI_MODEL }}' '${{ secrets.MCP_URL }}' > ~/whatsup-bot.env && chmod 600 ~/whatsup-bot.env"

      - name: Copy binaries to VM
        run: |
          scp -i ~/.ssh/id_rsa whatsup-bot ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_IP }}:~/whatsup-bot/whatsup-bot.new
          scp -i ~/.ssh/id_rsa whatsup-bot-mcp ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_IP }}:~/whatsup-bot/whatsup-bot-mcp.new
          scp -i ~/.ssh/id_rsa deploy/whatsup-bot-mcp.service ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_IP }}:~/whatsup-bot/whatsup-bot-mcp.service.tmpl

      - name: Replace bot binary and restart service
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_IP }} \
            "mv ~/whatsup-bot/whatsup-bot.new ~/whatsup-bot/whatsup-bot && chmod +x ~/whatsup-bot/whatsup-bot && sudo systemctl restart whatsup-bot"

      # the mcp unit runs as the same user, in the same directory as the bot, so both open the same whatsup.db
      - name: Replace MCP binary, install unit and restart service
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_IP }} 'set -e
            BOT_USER=$(systemctl show -p User --value whatsup-bot)
            BOT_WORKDIR=$(systemctl show -p WorkingDirectory --value whatsup-bot)
            if [ -z "$BOT_USER" ] || [ -z "$BOT_WORKDIR" ]; then echo "whatsup-bot unit must set User= and WorkingDirectory=" >&2; exit 1; fi
            mv ~/whatsup-bot/whatsup-bot-mcp.new "$BOT_WORKDIR/whatsup-bot-mcp" && chmod +x "$BOT_WORKDIR/whatsup-bot-mcp"
            sed -e "s|__USER__|$BOT_USER|g" -e "s|__WORKDIR__|$BOT_WORKDIR|g" ~/whatsup-bot/whatsup-bot-mcp.service.tmpl | sudo tee /etc/systemd/system/whatsup-bot-mcp.service > /dev/null
            sudo systemctl daemon-reload
            sudo systemctl enable whatsup-bot-mcp
            sudo systemctl restart whatsup-bot-mcp'